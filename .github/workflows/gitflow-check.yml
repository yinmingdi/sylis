name: GitFlow compliance

on:
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  gitflow:
    name: GitFlow required
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate branch transition and release version
        env:
          SOURCE: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref }}
        run: |
          case "$SOURCE" in
            feature/*|bugfix/*|release/*|hotfix/*) ;;
            *) echo "Unsupported source branch: $SOURCE"; exit 1 ;;
          esac
          case "$TARGET" in
            main) [[ "$SOURCE" = release/* || "$SOURCE" = hotfix/* ]] ;;
            develop) [[ "$SOURCE" = feature/* || "$SOURCE" = bugfix/* || "$SOURCE" = release/* || "$SOURCE" = hotfix/* ]] ;;
            release/*) [[ "$SOURCE" = develop || "$SOURCE" = bugfix/* ]] ;;
            hotfix/*) [[ "$SOURCE" = main || "$SOURCE" = bugfix/* ]] ;;
            *) exit 1 ;;
          esac
          if [[ "$SOURCE" = release/* ]]; then
            test "${SOURCE#release/}" = "$(node -p "require('./package.json').version")"
          fi
      - name: Validate conventional commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([^)]+\))?!?: .+'
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            [[ "$subject" =~ $pattern ]] || { echo "Invalid commit subject: $subject"; exit 1; }
          done
      - name: Validate repository secret policy
        run: node tools/architecture/check-secrets.mjs
