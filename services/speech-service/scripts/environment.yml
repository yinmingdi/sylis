# Sylis Speech Service 环境配置
name: sylis-speech-service
channels:
  - conda-forge # ⭐ 优先使用 conda-forge（解决 NumPy/MFA 兼容性）
  - pytorch
  - defaults

dependencies:
  # Python
  - python=3.9

  # 核心依赖
  - pip
  - numpy>=1.21.0,<2.0 # ⭐ NumPy 1.x（MFA 要求）
  - scipy>=1.9.0

  # PyTorch（模型训练和推理）
  - pytorch>=1.12.0
  - torchaudio>=0.12.0

  # 音频处理
  - librosa>=0.9.0
  - pysoundfile>=0.12.0
  - ffmpeg
  - sox

  # 数据集（训练时下载 SpeechOcean762）
  - datasets>=2.0.0

  # Web 框架（API 服务）
  - fastapi>=0.100.0
  - uvicorn>=0.20.0
  - python-multipart>=0.0.5

  # Montreal Forced Aligner（音素对齐）
  - montreal-forced-aligner>=2.0.0
  - praatio>=5.0.0 # TextGrid 解析

  # 工具
  - pytest>=7.0.0 # 测试
  - tqdm # 进度条
  - pyyaml # 配置文件
