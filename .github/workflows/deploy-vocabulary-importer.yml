name: Deploy vocabulary importer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - import
      confirmation:
        description: Type IMPORT to allow production writes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: vocabulary-importer-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode == 'import' && 'Import production vocabulary' || 'Dry-run production vocabulary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: sylis / production
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_IMPORTER_SERVICE_ID: ${{ vars.RAILWAY_IMPORTER_SERVICE_ID }}
      IMPORTER_MODE: ${{ inputs.mode }}
      IMPORTER_CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_ECDICT_SELECTED: "770611"
      EXPECTED_ECDICT_BOOKS: "24"

    steps:
      - name: Validate production dispatch
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Vocabulary deployments must be dispatched from main." >&2
            exit 1
          fi
          if [[ "$IMPORTER_MODE" == "import" && "$IMPORTER_CONFIRMATION" != "IMPORT" ]]; then
            echo "Production import requires confirmation value IMPORT." >&2
            exit 1
          fi
          if [[ -z "$RAILWAY_TOKEN" || -z "$RAILWAY_PROJECT_ID" || -z "$RAILWAY_ENVIRONMENT_ID" || -z "$RAILWAY_IMPORTER_SERVICE_ID" ]]; then
            echo "The sylis / production GitHub environment is missing Railway configuration." >&2
            exit 1
          fi

      - name: Checkout dispatched main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.30.3

      - name: Deploy and verify importer
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DO_NOT_TRACK: "1"
        run: node scripts/deploy-vocabulary-importer.mjs

      - name: Restore dry-run default
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DO_NOT_TRACK: "1"
        run: >-
          railway variable set ECDICT_DRY_RUN=true
          --project "$RAILWAY_PROJECT_ID"
          --service "$RAILWAY_IMPORTER_SERVICE_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --skip-deploys
