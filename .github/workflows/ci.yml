name: CI

on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop, main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  harness:
    name: Harness and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Harness toolkit
        run: pnpm harness:test
      - name: Validate repository Harness
        run: pnpm harness:check
      - name: Validate workspace architecture
        run: pnpm architecture:check
      - name: Validate workflow policy
        run: pnpm workflows:check
      - name: Validate documentation contracts
        run: pnpm docs:check
      - name: Validate patch whitespace
        run: git diff --check

  quality:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sylis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sylis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sylis
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-not-for-production-000000
      JWT_EXPIRES_IN: 30d
      AI_API_KEY: ci-placeholder-key
      AI_BASE_URL: https://api.deepseek.com
      AI_MODEL: deepseek-v4-flash
      AI_ENRICHMENT_ENABLED: "false"
      MAILER_HOST: localhost
      MAILER_PORT: 1025
      MAILER_SECURE: "false"
      MAILER_USER: ci-user
      MAILER_PASS: ci-password
      MAILER_FROM: Sylis CI <ci@example.com>
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @sylis/api prisma:generate
      - name: Configure affected Git range
        if: github.event_name == 'pull_request'
        run: |
          echo "TURBO_SCM_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          echo "TURBO_SCM_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
      - name: Lint, typecheck, test, and build affected packages
        if: github.event_name == 'pull_request'
        run: pnpm ci:affected
      - name: Lint, typecheck, test, and build all packages
        if: github.event_name == 'push'
        run: pnpm ci:full
      - name: Build integration applications
        run: pnpm exec turbo run build --filter=@sylis/api --filter=@sylis/web --filter=@sylis/vocabulary-importer
      - name: Apply migrations to a fresh database
        run: pnpm --filter @sylis/api exec prisma migrate deploy
      - name: Test vocabulary importer deployment script
        run: node --test scripts/deploy-vocabulary-importer.test.mjs
      - name: Vocabulary importer dry-run and idempotency
        run: |
          fixture=services/vocabulary-importer/test/fixtures/ecdict.csv
          checksum=$(sha256sum "$fixture" | cut -d ' ' -f 1)
          pnpm --filter @sylis/vocabulary-importer start --source "test/fixtures/ecdict.csv" --sha256 "$checksum" --scope all --expected-selected 3 --dry-run
          pnpm --filter @sylis/vocabulary-importer start --source "test/fixtures/ecdict.csv" --sha256 "$checksum" --scope all --expected-selected 3
          pnpm --filter @sylis/vocabulary-importer start --source "test/fixtures/ecdict.csv" --sha256 "$checksum" --scope all --expected-selected 3
          pnpm --filter @sylis/vocabulary-importer verify:fixture
      - name: API health smoke test
        run: |
          pnpm --filter @sylis/api start:prod > /tmp/sylis-api.log 2>&1 &
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/health
      - name: Build and smoke test web image
        run: |
          docker build -f apps/web/Dockerfile -t sylis-web:ci .
          docker run --detach --name sylis-web-ci -p 8080:8080 -e PORT=8080 sylis-web:ci
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/health

  required:
    name: CI required
    if: always()
    needs: [secret-scan, harness, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$SECRET_SCAN_RESULT" = success
          test "$HARNESS_RESULT" = success
          test "$QUALITY_RESULT" = success
