name: Production release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Green main commit already deployed to staging
        type: string
        required: true
      release_tag:
        description: Immutable release tag
        type: choice
        required: true
        default: v0.0.1
        options: [v0.0.1]
      confirmation:
        description: Type the exact release tag to confirm production promotion
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: sylis-production-environment
  cancel-in-progress: false

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "10.23.0"

jobs:
  verify:
    name: Verify staging evidence
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.evidence.outputs.ci_run_id }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable release identity
        id: release
        env:
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMATION" = "$RELEASE_TAG"
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = v0.0.1
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          echo "commit_sha=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Resolve the successful CI and staging manifest
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
        run: |
          run_id=$(gh run list \
            --workflow ci.yml \
            --commit "$RELEASE_COMMIT" \
            --event push \
            --limit 100 \
            --json databaseId,conclusion,headSha \
            --jq '[.[] | select(.headSha == env.RELEASE_COMMIT and .conclusion == "success")][0].databaseId // empty')
          test -n "$run_id"
          mkdir -p .artifacts/release
          gh run download "$run_id" \
            --name staging-image-manifest \
            --dir .artifacts/release
          test "$(jq -r '.commit' .artifacts/release/staging-manifest.json)" = "$RELEASE_COMMIT"
          test "$(jq -r '.version' .artifacts/release/staging-manifest.json)" = 0.0.1
          test "$(jq '.images | length' .artifacts/release/staging-manifest.json)" = 12
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Promote api and install database
    needs: verify
    runs-on: ubuntu-latest
    environment: sylis / production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the exact staging manifest
        env:
          CI_RUN_ID: ${{ needs.verify.outputs.ci_run_id }}
        run: |
          mkdir -p .artifacts/release
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name staging-image-manifest \
            --dir .artifacts/release
      - name: Install the pinned Railway CLI
        run: npm install --global @railway/cli@5.30.4
      - name: Run API pre-deploy database install and wait for readiness
        run: |
          test -n "$SERVICE_ID"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          immutable=$(jq -r '.images[] | select(.application == "api") | .image' .artifacts/release/staging-manifest.json)
          test -n "$immutable"
          railway service source connect \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$SERVICE_ID" \
            --image "$immutable" \
            --json > /tmp/railway-source.json
          deployment=$(railway service redeploy \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$SERVICE_ID" \
            --from-source \
            --yes \
            --json)
          deployment_id=$(printf '%s' "$deployment" | jq -r '.id // .deploymentId // empty')
          test -n "$deployment_id"
          for attempt in $(seq 1 90); do
            status_json=$(railway service status \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$SERVICE_ID" \
              --json)
            current_id=$(printf '%s' "$status_json" | jq -r '.deploymentId // empty')
            status=$(printf '%s' "$status_json" | jq -r '.status // empty')
            if [ "$current_id" = "$deployment_id" ] && [ "$status" = SUCCESS ]; then
              printf '%s\n' "service=api image=$immutable deployment=$deployment_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            case "$status" in FAILED|CRASHED|REMOVED) exit 1 ;; esac
            sleep 10
          done
          exit 1

  deploy:
    name: Promote ${{ matrix.name }}
    needs: [verify, deploy-api]
    runs-on: ubuntu-latest
    environment: sylis / production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            service_variable: RAILWAY_WEB_SERVICE_ID
          - name: admin
            service_variable: RAILWAY_ADMIN_SERVICE_ID
          - name: admin-api
            service_variable: RAILWAY_ADMIN_API_SERVICE_ID
          - name: agent-api
            service_variable: RAILWAY_AGENT_API_SERVICE_ID
          - name: model-gateway
            service_variable: RAILWAY_MODEL_GATEWAY_SERVICE_ID
          - name: agent-executor
            service_variable: RAILWAY_AGENT_EXECUTOR_SERVICE_ID
          - name: agent-evaluator
            service_variable: RAILWAY_AGENT_EVALUATOR_SERVICE_ID
          - name: asset-processor
            service_variable: RAILWAY_ASSET_PROCESSOR_SERVICE_ID
          - name: automation-executor
            service_variable: RAILWAY_AUTOMATION_EXECUTOR_SERVICE_ID
          - name: lexicon-builder
            service_variable: RAILWAY_LEXICON_BUILDER_SERVICE_ID
          - name: lexicon-publisher
            service_variable: RAILWAY_LEXICON_PUBLISHER_SERVICE_ID
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the exact staging manifest
        env:
          CI_RUN_ID: ${{ needs.verify.outputs.ci_run_id }}
        run: |
          mkdir -p .artifacts/release
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name staging-image-manifest \
            --dir .artifacts/release
      - name: Install the pinned Railway CLI
        run: npm install --global @railway/cli@5.30.4
      - name: Promote without rebuilding
        env:
          SERVICE_ID: ${{ vars[matrix.service_variable] }}
          APPLICATION: ${{ matrix.name }}
        run: |
          test -n "$SERVICE_ID"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT_ID"
          immutable=$(jq -r --arg application "$APPLICATION" '.images[] | select(.application == $application) | .image' .artifacts/release/staging-manifest.json)
          test -n "$immutable"
          railway service source connect \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$SERVICE_ID" \
            --image "$immutable" \
            --json > /tmp/railway-source.json
          deployment=$(railway service redeploy \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$SERVICE_ID" \
            --from-source \
            --yes \
            --json)
          deployment_id=$(printf '%s' "$deployment" | jq -r '.id // .deploymentId // empty')
          test -n "$deployment_id"
          for attempt in $(seq 1 90); do
            status_json=$(railway service status \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service "$SERVICE_ID" \
              --json)
            current_id=$(printf '%s' "$status_json" | jq -r '.deploymentId // empty')
            status=$(printf '%s' "$status_json" | jq -r '.status // empty')
            if [ "$current_id" = "$deployment_id" ] && [ "$status" = SUCCESS ]; then
              printf '%s\n' "service=$APPLICATION image=$immutable deployment=$deployment_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            case "$status" in FAILED|CRASHED|REMOVED) exit 1 ;; esac
            sleep 10
          done
          exit 1

  smoke:
    name: Production smoke
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    environment: sylis / production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Download the exact deployment manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ needs.verify.outputs.ci_run_id }}
        run: |
          mkdir -p .artifacts/production
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name staging-image-manifest \
            --dir .artifacts/production
      - name: Check all production deployment edges
        env:
          SYLIS_DEPLOYMENT_MANIFEST: .artifacts/production/staging-manifest.json
          SYLIS_WEB_URL: ${{ vars.SYLIS_WEB_URL }}
          SYLIS_ADMIN_URL: ${{ vars.SYLIS_ADMIN_URL }}
          SYLIS_API_URL: ${{ vars.SYLIS_API_URL }}
          SYLIS_EVIDENCE_DIR: .artifacts/production
        run: node tools/operations/cli.mjs health-rehearsal
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed shells and authenticated read paths
        env:
          SYLIS_WEB_URL: ${{ vars.SYLIS_WEB_URL }}
          SYLIS_ADMIN_URL: ${{ vars.SYLIS_ADMIN_URL }}
          SYLIS_EXPECTED_VERSION: "0.0.1"
          SYLIS_EXPECTED_COMMIT_SHA: ${{ needs.verify.outputs.commit_sha }}
          SYLIS_SYNTHETIC_USER_EMAIL: ${{ secrets.SYLIS_SYNTHETIC_USER_EMAIL }}
          SYLIS_SYNTHETIC_USER_PASSWORD: ${{ secrets.SYLIS_SYNTHETIC_USER_PASSWORD }}
          SYLIS_SYNTHETIC_ADMIN_EMAIL: ${{ secrets.SYLIS_SYNTHETIC_ADMIN_EMAIL }}
          SYLIS_SYNTHETIC_ADMIN_PASSWORD: ${{ secrets.SYLIS_SYNTHETIC_ADMIN_PASSWORD }}
          SYLIS_SYNTHETIC_ADMIN_TOTP_SECRET: ${{ secrets.SYLIS_SYNTHETIC_ADMIN_TOTP_SECRET }}
        run: pnpm exec playwright test --config tests/deployment/playwright.config.ts
      - name: Record the immutable production release
        env:
          DEPLOYMENT_INGEST_TOKEN: ${{ secrets.DEPLOYMENT_INGEST_TOKEN }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ needs.verify.outputs.ci_run_id }}
          SYLIS_ADMIN_URL: ${{ vars.SYLIS_ADMIN_URL }}
          SYLIS_API_URL: ${{ vars.SYLIS_API_URL }}
        run: |
          test -n "$DEPLOYMENT_INGEST_TOKEN"
          test -n "$SYLIS_ADMIN_URL"
          test -n "$SYLIS_API_URL"
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          manifest_hash="sha256:$(sha256sum .artifacts/production/staging-manifest.json | cut -d ' ' -f 1)"
          jq \
            --arg version "${RELEASE_TAG#v}" \
            --arg gitSha "$RELEASE_COMMIT" \
            --arg schemaVersion "sylis.deployment-evidence/1" \
            --arg ciRunId "$CI_RUN_ID" \
            --arg releaseWorkflowRunId "$GITHUB_RUN_ID" \
            --arg manifestHash "$manifest_hash" \
            --arg workflowUrl "$workflow_url" \
            --arg deploymentUrl "$SYLIS_API_URL" \
            '{
              version:$version,
              gitSha:$gitSha,
              imageDigests:(.images | map({key:.application,value:.image}) | from_entries),
              stagingEvidence:{
                schemaVersion:$schemaVersion,
                manifestSchemaVersion:.schemaVersion,
                ciRunId:$ciRunId,
                releaseWorkflowRunId:$releaseWorkflowRunId,
                manifestHash:$manifestHash,
                commit:.commit,
                productionSmoke:"SUCCEEDED"
              },
              approvalRef:$workflowUrl,
              productionEnvironment:"PRODUCTION",
              workflowUrl:$workflowUrl,
              deploymentUrl:$deploymentUrl
            }' \
            .artifacts/production/staging-manifest.json \
            > .artifacts/production/deployment-release-request.json
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $DEPLOYMENT_INGEST_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @.artifacts/production/deployment-release-request.json \
            --output .artifacts/production/deployment-release.json \
            "$SYLIS_ADMIN_URL/internal/v1/deployment-releases"
          test "$(jq -r '.version' .artifacts/production/deployment-release.json)" = "${RELEASE_TAG#v}"
          test "$(jq -r '.gitSha' .artifacts/production/deployment-release.json)" = "$RELEASE_COMMIT"
      - name: Upload production browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-browser-smoke
          path: |
            .artifacts/production
            tests/deployment/report
            tests/deployment/test-results
          retention-days: 30
          if-no-files-found: warn

  publish-release:
    name: Publish ${{ inputs.release_tag }}
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          fetch-depth: 0
      - name: Create the immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit_sha }}
        run: |
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_COMMIT"
          else
            git config user.name github-actions[bot]
            git config user.email github-actions[bot]@users.noreply.github.com
            git tag --annotate "$RELEASE_TAG" "$RELEASE_COMMIT" --message "Sylis $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "Sylis $RELEASE_TAG" --generate-notes
